[package]
name = "wakuwaku-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless WakuWaku provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "wakuwaku-daemon"
path = "src/main.rs"

[[bin]]
name = "wakuwaku-debug-daemon"
path = "src/bin/wakuwaku-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
wakuwaku-core = { path = "../wakuwaku-core" }
wakuwaku-protocol = { path = "../wakuwaku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
