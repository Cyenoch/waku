[package]
name = "waku-provider"
version = "0.1.0"
edition = "2024"
description = "Canonical HTTP provider identity, wire format, and endpoint config"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
