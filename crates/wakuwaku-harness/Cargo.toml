[package]
name = "wakuwaku-harness"
version = "0.1.0"
edition = "2024"
description = "Runtime-native LLM harness: HTTP provider seam, agent loop, and coding tools for WakuWaku"
license = "GPL-3.0-only"

[dependencies]
event-listener = "5"
parking_lot = "0.12"
futures = "0.3"
futures-timer = "3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
] }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
url = "2"
wakuwaku-provider = { path = "../wakuwaku-provider" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "time", "io-util"] }
